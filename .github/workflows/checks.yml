# Lint, typecheck and tests on every push. The app and worker run on the Hostinger VPS; build-images.yml builds
# their images and the VPS picks them up on its own.
name: Checks

on:
  push:
    branches: [claude/arrowsterr-ai-visibility-ft7nva]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
